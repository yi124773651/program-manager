name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version consistency
        run: npm run check:versions

      - name: Check tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag version v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Check Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Test Rust
        run: cargo test
        working-directory: src-tauri

      - name: Check Rust
        run: cargo check
        working-directory: src-tauri

      - name: Build Tauri app
        run: npm run tauri build

      - name: Generate release manifest
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $mainBinary = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/program-manager.exe'
          $installers = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/bundle/nsis/*.exe'
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release/program-manager-release-manifest.json'
          $releaseVersion = node -p "require('./package.json').version"
          & "$env:GITHUB_WORKSPACE/scripts/create-release-manifest.ps1" `
            -OutputPath $manifest `
            -ArtifactPath $mainBinary, $installers `
            -Version $releaseVersion `
            -Commit $env:RELEASE_COMMIT `
            -BuiltAt ([DateTimeOffset]::UtcNow.ToString('O')) `
            -RepositoryRoot $env:GITHUB_WORKSPACE

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: '程序管理器 ${{ github.ref_name }}'
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/program-manager.exe
            src-tauri/target/release/program-manager-release-manifest.json
